name: Test Ollama Pro

on:
  push:
    branches: [main, develop]
    paths:
      - 'ollama-pro'
      - 'test-ollama-pro.sh'
      - '.github/workflows/test-ollama-pro.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ollama-pro'
      - 'test-ollama-pro.sh'
      - '.github/workflows/test-ollama-pro.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ollama-pro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y jq
          else
            brew install jq
          fi
          python -m pip install --upgrade pip

      - name: Run Ollama Pro tests
        shell: bash
        run: |
          chmod +x ollama-pro test-ollama-pro.sh
          ./test-ollama-pro.sh --verbose

      - name: Validate emitted test reports
        if: always()
        shell: bash
        run: |
          if compgen -G 'tests/results/*.json' >/dev/null; then
            for report in tests/results/*.json; do jq empty "$report"; done
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ollama-pro-test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: tests/results/
          if-no-files-found: warn
          retention-days: 14

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check maintained Ollama surfaces
        run: shellcheck --severity=error ollama-pro test-ollama-pro.sh

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy security scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
